name: CI/CD Stroke Prediction

on:
  push:
    branches: [ "main", "feature/deploiement" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installation les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configuration DVC et Recuperation modele
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: |
          mkdir -p ~/.config/dvc/
          echo "{\"client_id\": \"$GDRIVE_CLIENT_ID\", \"client_secret\": \"$GDRIVE_CLIENT_SECRET\", \"refresh_token\": \"$GDRIVE_REFRESH_TOKEN\"}" > ~/.config/dvc/gdrive-user-credentials.json
          dvc remote modify storage --local gdrive_user_credentials_file ~/.config/dvc/gdrive-user-credentials.json
          dvc pull

      - name: lancement des tests
        run: |
          pytest